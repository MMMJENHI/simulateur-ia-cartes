<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- PRIORITÉ N°1 : LA BALISE QUE LINKEDIN RÉCLAME -->
    <title>IA Lab RLC [NON...Jenhi.Mariame]</title>

    <meta name="author" content="[Jenhi.Mariame]">
    <meta name="publish_date" content="2026-05-15">
    
    <!-- MÉTADONNÉES OPEN GRAPH (LINKEDIN) -->
    <meta property="og:title" content="IA Lab RLC [NON...Jenhi.Mariame]">
    <meta property="og:author" content="NON...Jenhi.Mariame">
    <meta property="og:description" content="Analyseur de circuit RLC version [NON...Jenhi.Mariame]. Design Harmonieux et précision scientifique.">
    <meta property="og:type" content="article">
    <meta property="article:author" content="NON...Jenhi.Mariame">
    <meta property="article:published_time" content="2026-05-15">
    <meta property="og:image" content="https://images.unsplash.com/photo-1517077304055-6e89abbf09b0?auto=format&fit=crop&w=1200&q=80">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #e2e8f0; }
        .gradient-text {
            background: linear-gradient(to right, #818cf8, #22d3ee, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .custom-slider::-webkit-slider-thumb {
            appearance: none; width: 18px; height: 18px;
            background: #6366f1; border-radius: 50%; border: 2px solid white; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        const App = () => {
            const [params, setParams] = useState({ R: 50, L: 0.1, C: 10, Ve: 5 });
            const chartInstance = useRef(null);

            const physics = useMemo(() => {
                const labels = [];
                const values = [];
                const { R, L, Ve } = params;
                const C = params.C * 1e-6;
                const f0 = 1 / (2 * Math.PI * Math.sqrt(L * C));
                const Q = (1 / R) * Math.sqrt(L / C);

                for (let f = 10; f <= 100000; f *= 1.1) {
                    const omega = 2 * Math.PI * f;
                    const Z = Math.sqrt(R**2 + Math.pow(L*omega - 1/(C*omega), 2));
                    values.push((R / Z) * Ve);
                    labels.push(Math.round(f));
                }
                return { labels, values, f0, Q };
            }, [params]);

            useEffect(() => {
                const ctx = document.getElementById('resChart').getContext('2d');
                if (chartInstance.current) chartInstance.current.destroy();
                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: physics.labels,
                        datasets: [{
                            data: physics.values,
                            borderColor: '#6366f1',
                            borderWidth: 3,
                            fill: true,
                            backgroundColor: 'rgba(99, 102, 241, 0.1)',
                            tension: 0.4,
                            pointRadius: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { type: 'logarithmic', grid: { color: '#1e293b' }, ticks: { color: '#64748b' } },
                            y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b' }, min: 0 }
                        },
                        plugins: { legend: { display: false } }
                    }
                });
            }, [physics]);

            useEffect(() => { if(window.lucide) window.lucide.createIcons(); }, []);

            return (
                <div className="p-4 md:p-8 max-w-6xl mx-auto">
                    {/* Header */}
                    <header className="flex flex-col md:flex-row justify-between items-center mb-10 border-b border-slate-800 pb-8 gap-4">
                        <div className="flex items-center gap-4">
                            <div className="bg-indigo-600 p-3 rounded-2xl shadow-lg shadow-indigo-900/40">
                                <i data-lucide="activity" className="text-white w-8 h-8"></i>
                            </div>
                            <div>
                                <div className="flex items-center gap-3">
                                    <h1 className="text-4xl font-black uppercase italic gradient-text">IA Lab RLC</h1>
                                    <span className="bg-emerald-500 text-slate-950 text-[10px] font-black px-2 py-1 rounded-md">
                                        NON...Jenhi.Mariame
                                    </span>
                                </div>
                                <p className="text-slate-500 text-[10px] font-mono tracking-widest uppercase mt-1">Frequency Analysis System</p>
                            </div>
                        </div>
                        <div className="flex gap-4">
                            <div className="bg-slate-900 border border-slate-800 px-6 py-2 rounded-xl text-center">
                                <span className="block text-[9px] text-slate-500 font-bold uppercase tracking-tighter">Résonance f0</span>
                                <span className="text-emerald-400 font-mono font-bold text-xl">{Math.round(physics.f0)} Hz</span>
                            </div>
                        </div>
                    </header>

                    {/* Simulation Content */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-12">
                        <aside className="lg:col-span-4 space-y-6">
                            <div className="bg-slate-900 rounded-3xl p-6 border border-slate-800 shadow-xl">
                                <h2 className="text-xs font-bold uppercase text-blue-400 mb-8 flex items-center gap-2 tracking-widest">
                                    <i data-lucide="settings" className="w-4 h-4"></i> Configuration
                                </h2>
                                <div className="space-y-8">
                                    {[
                                        { label: "Résistance (R)", key: "R", unit: "Ω", min: 5, max: 500 },
                                        { label: "Inductance (L)", key: "L", unit: "H", min: 0.01, max: 0.5 },
                                        { label: "Capacité (C)", key: "C", unit: "µF", min: 1, max: 100 }
                                    ].map(input => (
                                        <div key={input.key}>
                                            <div className="flex justify-between text-[10px] mb-2 font-bold text-slate-500 uppercase">
                                                {input.label} <span className="text-blue-400 font-mono">{params[input.key]} {input.unit}</span>
                                            </div>
                                            <input 
                                                type="range" min={input.min} max={input.max} step={input.key === 'L' ? 0.01 : 1}
                                                value={params[input.key]} 
                                                onChange={e => setParams({...params, [input.key]: Number(e.target.value)})} 
                                                className="custom-slider w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer" 
                                            />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </aside>

                        <main className="lg:col-span-8 bg-slate-900 rounded-[2.5rem] p-8 border border-slate-800 h-[450px] flex flex-col shadow-2xl">
                            <h3 className="text-lg font-bold mb-8 flex items-center gap-3 italic text-white text-center">
                                <i data-lucide="waveform" className="text-indigo-500"></i> Courbe de Résonance |Vs(f)|
                            </h3>
                            <div className="flex-grow"><canvas id="resChart"></canvas></div>
                        </main>
                    </div>

                    {/* Section Design Harmonieux */}
                    <section className="bg-slate-900/50 rounded-3xl p-8 border border-slate-800">
                        <h2 className="text-2xl font-black italic text-white mb-8 tracking-tighter">Design Harmonieux</h2>
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                            <div className="p-6 bg-slate-950 rounded-2xl border border-slate-800 hover:border-indigo-500/50 transition-all group text-center">
                                <i data-lucide="filter" className="mb-4 text-indigo-500 w-8 h-8 mx-auto group-hover:scale-110 transition-transform"></i>
                                <h4 className="text-xs font-bold text-slate-200 uppercase mb-2 tracking-widest">Passe-Bande</h4>
                                <p className="text-[11px] text-slate-400 leading-relaxed">Filtrage sélectif précis. Plus le facteur Q est élevé, plus la bande passante est étroite.</p>
                            </div>
                            <div className="p-6 bg-slate-950 rounded-2xl border border-slate-800 hover:border-yellow-500/50 transition-all group text-center">
                                <i data-lucide="zap" className="mb-4 text-yellow-500 w-8 h-8 mx-auto group-hover:scale-110 transition-transform"></i>
                                <h4 className="text-xs font-bold text-slate-200 uppercase mb-2 tracking-widest">Max de Courant</h4>
                                <p className="text-[11px] text-slate-400 leading-relaxed">À la résonance f0, l'impédance est minimale et le transfert d'énergie devient maximal.</p>
                            </div>
                            <div className="p-6 bg-slate-950 rounded-2xl border border-slate-800 hover:border-emerald-500/50 transition-all group text-center">
                                <i data-lucide="radio" className="mb-4 text-emerald-500 w-8 h-8 mx-auto group-hover:scale-110 transition-transform"></i>
                                <h4 className="text-xs font-bold text-slate-200 uppercase mb-2 tracking-widest">Applications</h4>
                                <p className="text-[11px] text-slate-400 leading-relaxed">Utilisé dans les télécommunications, les récepteurs radio et le filtrage audio.</p>
                            </div>
                        </div>
                    </section>

                    <footer className="mt-12 text-center text-slate-600 text-[10px] font-bold uppercase tracking-[0.4em]">
                        IA Lab RLC • Edition NON...Jenhi.Mariame • 2026
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
